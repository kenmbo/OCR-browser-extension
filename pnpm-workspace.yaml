packages:
  - .

engineStrict: true
saveExact: true
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true

# pnpm 12 defaults unlisted dependency builds to denied. Keep this map explicit:
# every required lifecycle build must be reviewed and approved by exact version.
allowBuilds: {}
minimumReleaseAgeExclude:
  - "@vitest/mocker@5.0.1"
  - "@vitest/spy@5.0.1"
  - vitest@5.0.1

